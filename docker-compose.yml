version: '3.8'

services:
  model-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: model-inference-api
    ports:
      - "9876:8000"
    volumes:
      # Mount volumes for persistent storage
      - ./uploads:/app/uploads
      - ./model_weights:/app/model_weights
      - ./data:/app/data
    environment:
      - DEBUG=False
      - DATABASE_URL=sqlite:////app/data/app.db
      - MODEL_WEIGHTS_DIR=/app/model_weights
      - UPLOAD_DIR=/app/uploads
      - WORKER_COUNT=2
      - MAX_QUEUE_SIZE=1000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
